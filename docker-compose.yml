services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rentcar
      POSTGRES_USER: rentcar
      POSTGRES_PASSWORD: rentcar
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentcar -d rentcar"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://rentcar:rentcar@db:5432/rentcar
      SECRET_KEY: replace-this-before-deployment
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
